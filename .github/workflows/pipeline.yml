name: pipeline

# Runs only from the default branch (GitHub rule for schedules). Needs repository secrets
# R2_ACCOUNT_ID, R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY, R2_BUCKET (see docs/betrieb.md).
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: pipeline
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/pyproject.toml

      - name: Install
        run: pip install ./pipeline

      # grid indexes + ICON coordinates (37 MB download once)
      - uses: actions/cache@v4
        with:
          path: ~/.cache/regenradar
          key: regenradar-cache-v1-${{ hashFiles('pipeline/regenradar/grid.py') }}
          restore-keys: regenradar-cache-v1-

      - name: Run
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: regenradar run --r2
