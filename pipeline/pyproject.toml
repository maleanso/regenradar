[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "regenradar"
version = "0.1.0"
description = "Precipitation layer (radar + ICON-CH1) from MeteoSwiss open data as Web Mercator PNG frames"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "scipy>=1.11",
  "h5py>=3.10",
  "pyproj>=3.6",
  "pillow>=10.0",
  "eccodes>=2.37",
  "eccodeslib>=2.37",
  "requests>=2.31",
  "boto3>=1.34",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
regenradar = "regenradar.cli:main"

[tool.setuptools.packages.find]
include = ["regenradar*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
